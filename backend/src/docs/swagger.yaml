
openapi: 3.0.0
info:
  title: Inventory Transactions API
  version: 1.0.0
  description: API para gerenciamento de produtos e transações

servers:
  - url: http://localhost:3333

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


paths:
  /auth/login:
    post:
      summary: Realiza login do usuário
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Login realizado com sucesso
        "401":
          description: Credenciais inválidas
